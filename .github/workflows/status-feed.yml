name: Status feed

# Coleta os feeds públicos listados em status/sources.json e publica
# status.json na branch "status-data" (commit único, sobrescrito a cada execução).
# A página /status/ lê esse arquivo via raw.githubusercontent.com.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "status/sources.json"
      - "status/collector/**"
      - ".github/workflows/status-feed.yml"

permissions:
  contents: write

concurrency:
  group: status-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: status
          fetch-depth: 1

      - name: Ler dados anteriores
        run: |
          if git fetch --depth=1 origin status-data 2>/dev/null; then
            git show FETCH_HEAD:status.json > prev.json || echo '{}' > prev.json
          else
            echo '{}' > prev.json
          fi

      - name: Coletar feeds
        id: collect
        continue-on-error: true
        env:
          # Opcional: Azure AI Translator (F0 gratuito). Sem os secrets, o painel mostra o texto original.
          TRANSLATOR_KEY: ${{ secrets.TRANSLATOR_KEY }}
          TRANSLATOR_REGION: ${{ secrets.TRANSLATOR_REGION }}
        run: python3 status/collector/collect.py --sources status/sources.json --previous prev.json --out status.json

      - name: Publicar na branch status-data
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s status.json || { echo "status.json não gerado"; exit 1; }
          python3 -c "import json;json.load(open('status.json'))"
          mkdir -p out && cp status.json out/
          cat > out/README.md <<'EOF'
          Branch gerada automaticamente pelo workflow "Status feed". Não editar.
          Consumida por https://andre0silva.github.io/status/
          EOF
          cd out
          git init -q -b status-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "status: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" status-data

      - name: Falha de coleta
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::warning::Todas as fontes falharam nesta execução (dados anteriores mantidos)."
          exit 1
